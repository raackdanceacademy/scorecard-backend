<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1600">
  <title>Dashboard — RAACK Scorify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js">
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js">
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
  </script>
  <style>
    /* (styles unchanged) */
    :root {
      --void: #f4f6f8;
      --base: #ffffff;
      --surface: #ffffff;
      --surface-2: #fafbfc;
      --surface-3: #f1f3f5;
      --line: #e4e7eb;
      --line-soft: rgba(20, 25, 33, 0.06);
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --grey-300: #5b6472;
      --grey-500: #8a93a1;
      --grey-700: #3a4250;
      --white: #16181d;
      --green: #16a34a;
      --teal: #0d9488;
      --amber: #d97706;
      --orange: #ea580c;
      --crimson: #dc2626;
      --shadow-sm: 0 1px 2px rgba(20, 25, 33, 0.06), 0 1px 1px rgba(20, 25, 33, 0.04);
      --shadow-md: 0 6px 16px rgba(20, 25, 33, 0.08);
      --radius: 14px;
    }

    [data-theme="dark"] {
      --void: #10131a;
      --base: #171b23;
      --surface: #1b1f28;
      --surface-2: #12151b;
      --surface-3: #262b35;
      --line: #2a2f3a;
      --line-soft: rgba(255, 255, 255, 0.06);
      --accent: #5b8def;
      --accent-dark: #3f6fd1;
      --accent-soft: rgba(91, 141, 239, 0.14);
      --grey-300: #b2b9c4;
      --grey-500: #7c8494;
      --grey-700: #dde1e7;
      --white: #f2f4f7;
      --green: #34d399;
      --teal: #2dd4bf;
      --amber: #fbbf24;
      --orange: #fb923c;
      --crimson: #f87171;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      background: var(--void);
      color: var(--white);
      min-height: 100vh;
      padding: 20px;
      transition: background .2s ease, color .2s ease;
    }

    svg.i {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .header {
      background: var(--surface);
      padding: 12px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
      max-width: 1560px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: var(--shadow-sm);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon-wrap {
      height: 36px;
      width: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: transparent;
      overflow: hidden;
    }

    .brand-icon {
      height: 100%;
      width: 100%;
      object-fit: contain;
      display: block;
      background: transparent;
      mix-blend-mode: multiply;
    }

    [data-theme="dark"] .brand-icon {
      mix-blend-mode: normal;
    }

    .header h1 {
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .header h1 span.dim {
      color: var(--grey-500);
      font-weight: 400;
    }

    .header h1 span.accent {
      color: var(--accent);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .header-controls select {
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--white);
      font-size: 12.5px;
      cursor: pointer;
      font-family: inherit;
    }

    .header-controls select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .role-badge {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      background: var(--accent);
      color: #fff;
    }

    .icon-btn {
      padding: 8px 13px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--grey-300);
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      transition: all .16s ease;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .icon-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .icon-btn.primary:hover {
      background: var(--accent-dark);
      color: #fff;
    }

    #formBtn.icon-btn.primary {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
    }

    #formBtn.icon-btn.primary:hover {
      background: #b91c1c;
      color: #fff;
    }

    .icon-btn.export {
      background: rgba(22, 163, 74, 0.08);
      border-color: #16a34a;
      color: #15803d;
    }

    .icon-btn.export:hover {
      background: rgba(22, 163, 74, 0.15);
      border-color: #16a34a;
      color: #15803d;
    }

    [data-theme="dark"] .icon-btn.export {
      background: rgba(52, 211, 153, 0.10);
      border-color: #34d399;
      color: #34d399;
    }

    .icon-btn.focus-toggle {
      background: rgba(220, 38, 38, 0.08);
      border-color: #dc2626;
      color: #b91c1c;
    }

    .icon-btn.focus-toggle:hover {
      background: rgba(220, 38, 38, 0.15);
    }

    .icon-btn.focus-toggle.active {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
    }

    [data-theme="dark"] .icon-btn.focus-toggle {
      background: rgba(248, 113, 113, 0.10);
      border-color: #f87171;
      color: #f87171;
    }

    [data-theme="dark"] .icon-btn.focus-toggle.active {
      background: #f87171;
      border-color: #f87171;
      color: #171b23;
    }

    .theme-toggle {
      padding: 8px 13px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--white);
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      white-space: nowrap;
      transition: all .16s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1560px;
      margin: 0 auto;
    }

    @media (max-width:1100px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .grid-full {
      grid-column: 1 / -1;
    }

    .card {
      background: var(--surface);
      padding: 22px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }

    .card h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card h2 .badge {
      font-size: 11.5px;
      background: var(--surface-3);
      color: var(--grey-300);
      padding: 3px 10px;
      border-radius: 7px;
      font-weight: 700;
      letter-spacing: 0.2px;
      border: 1px solid var(--line);
    }

    .card h2 .spacer {
      flex: 1;
    }

    .card-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .card-header-actions .icon-btn {
      font-size: 11.5px;
      padding: 5px 12px;
    }

    /* Category overview strip */
    .cat-overview-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    @media (max-width:1200px) {
      .cat-overview-row {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width:600px) {
      .cat-overview-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .cat-ov-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 8px;
    }

    .cat-ov-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cat-ov-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--grey-300);
    }

    .cat-ov-frac {
      font-size: 11px;
      color: var(--grey-500);
      font-weight: 600;
    }

    .cat-ov-pct {
      font-size: 13.5px;
      font-weight: 800;
    }

    .cat-color-financial_health {
      background: #0d9488;
    }

    .cat-color-student_growth {
      background: #16a34a;
    }

    .cat-color-operations_discipline {
      background: #d97706;
    }

    .cat-color-brand_quality {
      background: #dc2626;
    }

    .cat-color-customer_experience {
      background: #4f46e5;
    }

    .cat-color-local_marketing {
      background: #7c3aed;
    }

    .cat-color-base_score {
      background: #0d9488;
    }

    /* Horizontal bar chart for Score Distribution */
    .score-distribution-horizontal {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .sd-row {
      display: grid;
      grid-template-columns: 140px 1fr 80px;
      align-items: center;
      gap: 12px;
    }

    .sd-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--grey-300);
    }

    .sd-bar-track {
      height: 20px;
      background: var(--surface-3);
      border-radius: 0;
      overflow: hidden;
      position: relative;
    }

    .sd-bar-fill {
      height: 100%;
      border-radius: 0;
      transition: width 0.6s ease;
    }

    .sd-bar-target {
      height: 100%;
      border-radius: 0;
      background: var(--line);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      opacity: 0.3;
    }

    .sd-value {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      text-align: right;
    }

    .sd-value .max {
      font-size: 10px;
      color: var(--grey-500);
      font-weight: 600;
    }

    .sd-total {
      border-top: 2px solid var(--line);
      padding-top: 12px;
      margin-top: 6px;
      display: grid;
      grid-template-columns: 140px 1fr 80px;
      align-items: center;
      gap: 12px;
      font-weight: 700;
    }

    .sd-total .sd-label {
      font-size: 14px;
      color: var(--white);
    }

    .sd-total .sd-value {
      font-size: 15px;
      color: var(--accent);
    }

    /* ----- Collapsible Focus Areas box (moved to top of Score Distribution card) ----- */
    .focus-area-box {
      margin-bottom: 18px;
      padding: 14px 16px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .focus-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .focus-chip {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-3);
      color: var(--grey-300);
      border: 1px solid var(--line);
    }

    .focus-chip.critical {
      background: rgba(220, 38, 38, 0.12);
      color: #dc2626;
      border-color: #dc2626;
    }

    .focus-chip.risky {
      background: rgba(234, 88, 12, 0.12);
      color: #ea580c;
      border-color: #ea580c;
    }

    .focus-chip.watchlist {
      background: rgba(217, 119, 6, 0.12);
      color: #d97706;
      border-color: #d97706;
    }

    .focus-chip.good {
      background: rgba(13, 148, 136, 0.12);
      color: #0d9488;
      border-color: #0d9488;
    }

    .focus-chip.excellent {
      background: rgba(22, 163, 74, 0.12);
      color: #16a34a;
      border-color: #16a34a;
    }

    [data-theme="dark"] .focus-chip.critical {
      color: #f87171;
      border-color: #f87171;
    }

    [data-theme="dark"] .focus-chip.risky {
      color: #fb923c;
      border-color: #fb923c;
    }

    [data-theme="dark"] .focus-chip.watchlist {
      color: #fbbf24;
      border-color: #fbbf24;
    }

    [data-theme="dark"] .focus-chip.good {
      color: #2dd4bf;
      border-color: #2dd4bf;
    }

    [data-theme="dark"] .focus-chip.excellent {
      color: #34d399;
      border-color: #34d399;
    }

    .rating-legend-inline {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--grey-500);
    }

    .rating-legend-inline .rl-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
      flex-shrink: 0;
    }

    .rating-legend-chip {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid;
      line-height: 1.2;
    }

    .rating-legend-chip .rlc-range {
      opacity: 0.75;
      font-weight: 600;
      margin-right: 5px;
    }

    @media (max-width:600px) {
      .rating-legend-chip {
        font-size: 10px;
        padding: 3px 8px;
      }

      .rating-legend-chip .rlc-range {
        display: none;
      }
    }

    .score-summary-bottom {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .summary-text {
      font-size: 13.5px;
      color: var(--grey-300);
      line-height: 1.65;
      margin-bottom: 14px;
    }

    .summary-highlight {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
    }

    .summary-highlight .sh-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .summary-highlight .sh-title {
      font-weight: 800;
      font-size: 14px;
    }

    .summary-highlight .sh-sub {
      font-size: 12px;
      color: var(--grey-500);
      margin-top: 2px;
    }

    .month-mini-box {
      display: none;
    }

    .rating-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12.5px;
      letter-spacing: 0.2px;
    }

    .r-Excellent {
      background: rgba(22, 163, 74, 0.10);
      color: #15803d;
      border: 1px solid #16a34a;
    }

    .r-Good {
      background: rgba(13, 148, 136, 0.10);
      color: #0f766e;
      border: 1px solid #0d9488;
    }

    .r-Watchlist {
      background: rgba(217, 119, 6, 0.10);
      color: #b45309;
      border: 1px solid #d97706;
    }

    .r-Risky {
      background: rgba(234, 88, 12, 0.10);
      color: #c2410c;
      border: 1px solid #ea580c;
    }

    .r-Critical {
      background: rgba(220, 38, 38, 0.10);
      color: #b91c1c;
      border: 1px solid #dc2626;
    }

    .r-NoData {
      background: var(--surface-3);
      color: var(--grey-500);
      border: 1px solid var(--line);
    }

    [data-theme="dark"] .r-Excellent {
      color: #34d399;
    }

    [data-theme="dark"] .r-Good {
      color: #2dd4bf;
    }

    [data-theme="dark"] .r-Watchlist {
      color: #fbbf24;
    }

    [data-theme="dark"] .r-Risky {
      color: #fb923c;
    }

    [data-theme="dark"] .r-Critical {
      color: #f87171;
    }

    .filter-chip-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .filter-chip-row.cols-5 {
      grid-template-columns: repeat(5, 1fr);
    }

    @media (max-width:1200px) {
      .filter-chip-row.cols-5 {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width:1000px) {
      .filter-chip-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width:560px) {
      .filter-chip-row {
        grid-template-columns: 1fr;
      }
    }

    .filter-chip {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .filter-chip .fc-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .filter-chip .fc-body {
      flex: 1;
      min-width: 0;
    }

    .filter-chip .fc-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .3px;
      color: var(--grey-500);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .filter-chip select {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--white);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 0;
      cursor: pointer;
    }

    .filter-chip select:focus {
      outline: none;
    }

    .ranking-legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .ranking-legend .rl-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--grey-300);
      white-space: nowrap;
    }

    .ranking-legend .rl-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .ranking-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 76px 58px;
      align-items: center;
      gap: 12px;
      padding: 7px 4px;
      border-radius: 9px;
      cursor: pointer;
      transition: background .12s ease;
    }

    .ranking-row:hover {
      background: var(--surface-3);
    }

    .ranking-rank {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
      font-size: 13.5px;
      color: var(--grey-500);
      text-align: center;
    }

    .ranking-main {
      min-width: 0;
    }

    .ranking-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ranking-bar-track {
      height: 14px;
      background: var(--surface-3);
      border-radius: 7px;
      overflow: hidden;
    }

    .ranking-bar-fill {
      height: 100%;
      border-radius: 7px;
    }

    .ranking-score {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      color: var(--white);
      text-align: right;
      white-space: nowrap;
    }

    .ranking-score .max {
      font-size: 10px;
      color: var(--grey-500);
      font-weight: 600;
    }

    .ranking-pct-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--grey-300);
      grid-column: 1 / -1;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--grey-300);
      grid-column: 1 / -1;
    }

    .app-shell.no-sidebar {
      display: block;
    }

    .app-main {
      width: 100%;
    }

    /* Action buttons row */
    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
    }

    .action-row .spacer {
      flex: 1;
    }

    /* Table styles - improved alignment */
    .table-wrap {
      max-height: 540px;
      overflow-y: auto;
      border-radius: 10px;
      border: 1px solid var(--line);
    }

    .table-wrap::-webkit-scrollbar {
      width: 6px;
    }

    .table-wrap::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 6px;
    }

    .table-wrap table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .table-wrap table thead th {
      text-align: left;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--grey-500);
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      white-space: nowrap;
    }

    .table-wrap table thead th:nth-child(1) {
      width: 60px;
      text-align: center;
    }

    .table-wrap table thead th:nth-child(2) {
      width: 30%;
    }

    .table-wrap table thead th:nth-child(3) {
      width: 16%;
      text-align: center;
    }

    .table-wrap table thead th:nth-child(4) {
      width: 18%;
      text-align: center;
    }

    .table-wrap table thead th:nth-child(5) {
      width: 26%;
      text-align: left;
    }

    .table-wrap table tbody tr {
      cursor: pointer;
      transition: background .12s ease;
      border-bottom: 1px solid var(--line-soft);
    }

    .table-wrap table tbody tr:last-child {
      border-bottom: none;
    }

    .table-wrap table tbody tr:hover {
      background: var(--surface-3);
    }

    .table-wrap table tbody tr:hover .branch-name {
      color: var(--accent);
    }

    .table-wrap table tbody td {
      padding: 13px 14px;
      font-size: 14.5px;
      vertical-align: middle;
      line-height: 1.4;
    }

    .table-wrap table tbody td:nth-child(1) {
      text-align: center;
      color: var(--grey-500);
      font-weight: 600;
      font-size: 14px;
    }

    .table-wrap table tbody td:nth-child(3) {
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
    }

    .table-wrap table tbody td:nth-child(4) {
      text-align: center;
    }

    .table-wrap table tbody td:nth-child(5) {
      text-align: left;
      color: var(--grey-300);
      font-size: 13px;
    }

    .branch-name {
      font-weight: 600;
      transition: color .12s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .score-max {
      font-size: 11px;
      color: var(--grey-500);
      font-weight: 600;
      margin-left: 2px;
    }

    .sv-Excellent,
    .sv-Good {
      color: #15803d;
    }

    .sv-Watchlist {
      color: #b45309;
    }

    .sv-Risky {
      color: #c2410c;
    }

    .sv-Critical {
      color: #b91c1c;
    }

    [data-theme="dark"] .sv-Excellent,
    [data-theme="dark"] .sv-Good {
      color: #34d399;
    }

    [data-theme="dark"] .sv-Watchlist {
      color: #fbbf24;
    }

    [data-theme="dark"] .sv-Risky {
      color: #fb923c;
    }

    [data-theme="dark"] .sv-Critical {
      color: #f87171;
    }

    /* Filters row */
    .filters {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      align-items: center;
    }

    .filters select,
    .filters input {
      padding: 9px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--white);
      font-size: 14px;
      font-family: inherit;
      min-width: 150px;
    }

    .filters select:focus,
    .filters input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .filter-label {
      color: var(--grey-300);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* Chart */
    .chart-box {
      position: relative;
      height: 300px;
    }

    .chart-hint {
      font-size: 12px;
      color: var(--grey-500);
      text-align: center;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .data-view-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.45);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .data-view-modal-overlay.open {
      display: flex;
    }

    .data-view-modal {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      width: 100%;
      max-width: 620px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .data-view-modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line-soft);
      flex-wrap: wrap;
    }

    .data-view-modal-header h2 {
      font-size: 16.5px;
      font-weight: 700;
      flex: 1;
      margin: 0;
      padding: 0;
      border: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .data-view-modal-close {
      background: var(--surface-3);
      border: 1px solid var(--line);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--grey-300);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      flex-shrink: 0;
    }

    .data-view-modal-close:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .data-view-modal-body {
      padding: 6px 20px 20px;
      overflow-y: auto;
    }

    .data-view-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-view-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line-soft);
      font-size: 14px;
    }

    .data-view-table td.k {
      color: var(--grey-500);
      font-weight: 600;
      width: 46%;
    }

    .data-view-table td.v {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      color: var(--white);
      text-align: right;
    }

    .data-view-wrap {
      max-height: 500px;
      overflow-y: auto;
      margin-top: 14px;
      padding-right: 6px;
      margin-right: -6px;
    }

    .dv-section-head {
      font-weight: 700;
      font-size: 12.5px;
      padding: 9px 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border-bottom: 2px solid var(--line);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @media (max-width:600px) {
      body {
        padding: 10px;
        font-size: 14.5px;
      }

      .header {
        padding: 10px 12px;
        margin-bottom: 12px;
        gap: 10px;
      }

      .header-left {
        gap: 8px;
        width: 100%;
      }

      .header h1 {
        font-size: 14.5px;
      }

      .header-controls {
        width: 100%;
        gap: 8px;
      }

      .header-controls select,
      .header-controls .icon-btn,
      .header-controls .theme-toggle,
      .role-badge {
        flex: 1 1 calc(50% - 4px);
        font-size: 12px;
        padding: 8px 10px;
        text-align: center;
        justify-content: center;
      }

      .dashboard-grid {
        gap: 12px;
      }

      .card {
        padding: 15px;
      }

      .card h2 {
        font-size: 14.5px;
        margin-bottom: 11px;
        padding-bottom: 9px;
      }

      .sd-row {
        grid-template-columns: 80px 1fr 60px;
        gap: 8px;
      }

      .sd-label {
        font-size: 11px;
      }

      .sd-total {
        grid-template-columns: 80px 1fr 60px;
        gap: 8px;
      }

      .score-summary-bottom {
        grid-template-columns: 1fr;
      }

      .filter-chip-row.cols-5 {
        grid-template-columns: 1fr 1fr;
      }

      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .table-wrap table {
        min-width: 600px;
      }

      .table-wrap table thead th:nth-child(1) {
        width: 50px;
      }

      .table-wrap table thead th:nth-child(2) {
        width: 25%;
      }

      .table-wrap table thead th:nth-child(3) {
        width: 18%;
      }

      .table-wrap table thead th:nth-child(4) {
        width: 20%;
      }

      .table-wrap table thead th:nth-child(5) {
        width: 27%;
      }

      .action-row {
        flex-direction: column;
        align-items: stretch;
      }

      .action-row .spacer {
        display: none;
      }

      .card-header-actions {
        width: 100%;
        justify-content: flex-end;
      }

      .card-header-actions .icon-btn {
        font-size: 10.5px;
        padding: 4px 10px;
      }
    }

    @media (max-width:400px) {
      .filter-chip-row.cols-5 {
        grid-template-columns: 1fr;
      }
    }

    /* ----- Additional style for the red line chart ----- */
    .chart-box.branch-line {
      height: 380px;
      max-height: 380px;
    }

    .chart-box.branch-line canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* ----- Score Highlight donut (franchise view) ----- */
    .score-highlight-wrap {
      display: flex;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
    }

    .score-highlight-chart {
      position: relative;
      width: 170px;
      height: 170px;
      flex-shrink: 0;
    }

    .score-highlight-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .shc-value {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
    }

    .shc-max {
      font-size: 12px;
      color: var(--grey-500);
      font-weight: 700;
      margin-top: 2px;
    }

    .score-highlight-info {
      flex: 1;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .score-highlight-info .rating-badge {
      align-self: flex-start;
      font-size: 15px;
      padding: 7px 18px;
    }

    .shc-message {
      font-size: 15px;
      font-weight: 700;
    }

    .shc-sub {
      font-size: 12.5px;
      color: var(--grey-500);
      font-weight: 600;
    }

    @media (max-width:600px) {
      .score-highlight-wrap {
        gap: 16px;
      }

      .score-highlight-chart {
        width: 130px;
        height: 130px;
      }

      .shc-value {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <div id="appShellRoot">
    <div class="header">
      <div class="header-left">
        <div class="brand-icon-wrap"><img src="/static/logo.png" alt="RAACK" class="brand-icon"></div>
        <h1>RAACK Scorify <span class="dim">|</span> <span class="accent" id="pageTitle">Dashboard</span></h1>
      </div>
      <div class="header-controls">
        <span class="role-badge" id="roleBadge">Franchise</span>
        <select id="yearSelector" title="Year"></select>
        <select id="monthSelector" title="Month"></select>
        <button id="exportAllBtn" class="icon-btn export" style="display:none;"></button>
        <a href="/it-form" id="formBtn" class="icon-btn primary" style="display:none;"></a>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"></button>
        <!-- Back / Logout button -->
        <a href="/login" class="icon-btn" id="backBtn"></a>
      </div>
    </div>

    <div class="dashboard-grid" id="dashboardContent">
      <div class="loading">Loading dashboard data...</div>
    </div>
  </div>

  <div class="data-view-modal-overlay" id="dataViewModalOverlay">
    <div class="data-view-modal">
      <div class="data-view-modal-header">
        <h2 id="dataViewModalTitle"></h2>
        <button type="button" class="data-view-modal-close" id="dataViewModalCloseBtn" aria-label="Close">✕</button>
      </div>
      <div class="data-view-modal-body" id="dataViewModalBody"></div>
    </div>
  </div>

  <script>
    /* ===================== SIMPLE INLINE ICON SET ===================== */
    const ICONS = {
      money: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1.4 1.2-2 2.5-2s2.5.7 2.5 2-1.2 1.6-2.5 2-2.5.6-2.5 2 1.2 2 2.5 2 2.5-.6 2.5-2"/>',
      graduation: '<path d="M2 8l10-4 10 4-10 4-10-4z"/><path d="M6 10.5v4.5c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4.5"/><path d="M22 8v6"/>',
      gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 000-3l1-1.7-1.7-1.7-1.7 1a1.7 1.7 0 01-3-1.2L14.8 4h-2.4L12 6.9a1.7 1.7 0 01-3 1.2l-1.7-1-1.7 1.7 1 1.7a1.7 1.7 0 01-3 3l-1.8.4v2.4L4.6 16a1.7 1.7 0 013 1.2l-1 1.7 1.7 1.7 1.7-1a1.7 1.7 0 013 1.2l.4 1.8h2.4l.4-1.8a1.7 1.7 0 013-1.2l1.7 1 1.7-1.7-1-1.7a1.7 1.7 0 011.9-2.6z" opacity="0"/>',
      shield: '<path d="M12 3l7 3v6c0 4.4-3 7.7-7 9-4-1.3-7-4.6-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/>',
      smile: '<circle cx="12" cy="12" r="9"/><path d="M8.5 10.5h.01M15.5 10.5h.01"/><path d="M8 14.5c1 1.3 2.5 2 4 2s3-.7 4-2"/>',
      megaphone: '<path d="M3 10v4l3 .5V19a1 1 0 001 1h1a1 1 0 001-1v-4"/><path d="M3 10l14-5v14L3 14"/><path d="M17 8.5c1.4.7 2.3 2 2.3 3.5s-.9 2.8-2.3 3.5"/>',
      trophy: '<path d="M8 4h8v5a4 4 0 01-8 0V4z"/><path d="M6 5H4v2a3 3 0 003 3M18 5h2v2a3 3 0 01-3 3"/><path d="M10 13v3M14 13v3M8 20h8M9 20v-2h6v2"/>',
      warning: '<path d="M12 4l9 15H3l9-15z"/><path d="M12 10v4M12 17.5h.01"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
      chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
      building: '<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/><path d="M10 21v-4h4v4"/>',
      search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.5-4.5"/>',
      star: '<path d="M12 3l2.6 5.8 6.4.6-4.8 4.2 1.4 6.3L12 16.9 6.4 19.9l1.4-6.3-4.8-4.2 6.4-.6L12 3z"/>',
      check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5 5.5-6"/>',
      clipboard: '<rect x="6" y="4" width="12" height="17" rx="1.5"/><rect x="9" y="2.5" width="6" height="3" rx="1"/><path d="M9 11h6M9 15h6"/>',
      siren: '<circle cx="12" cy="12" r="9"/><path d="M12 7v6l3 2"/>',
      folder: '<path d="M3 6a1 1 0 011-1h5l2 2h9a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V6z"/>',
      arrowleft: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
      dashboard: '<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/>',
      form: '<path d="M6 3h9l4 4v14a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M14 3v5h5"/><path d="M9 13l2 2 4-4.5"/>',
      formula: '<path d="M16 4H9l-1 8 1 8h7" /><path d="M8 12h5"/>',
      user: '<circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20c1.2-3.6 4.2-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/>',
      sort: '<path d="M8 6v13M8 6L5 9M8 6l3 3M16 18V5M16 18l3-3M16 18l-3-3"/>',
      puzzle: '<path d="M9 4h4v2.2a1.6 1.6 0 002.6 1.2 1.6 1.6 0 012.6 1.2v3.4a1.6 1.6 0 01-2.6 1.2 1.6 1.6 0 00-2.6 1.2V17H4v-4h2.2a1.6 1.6 0 001.2-2.6A1.6 1.6 0 006.2 9H4V5h5V4z"/>',
      errorx: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
      dark: '<path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>',
      light: '<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
      download: '<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/>',
      target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.9" fill="currentColor"/>',
      up: '<path d="M12 19V6M6 11l6-6 6 6"/>',
      down: '<path d="M12 5v13M6 13l6 6 6-6"/>',
      flag: '<path d="M5 21V4"/><path d="M5 5h12l-2.2 4L17 13H5"/>',
      logout: '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
      chevron: '<path d="M6 9l6 6 6-6"/>',
      list: '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
      layers: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
      triangle: '<path d="M12 4l9 16H3L12 4z"/>',
      abacus: '<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M6 9h3M15 9h3M9 14h3M14 14h3"/>',
    };

    function I(name, cls) {
      const body = ICONS[name] || ICONS.dashboard;
      return `<svg class="i ${cls || ''}" viewBox="0 0 24 24">${body}</svg>`;
    }

    /* ===================== THEME ===================== */
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      const btn = document.getElementById('themeToggle');
      if (btn) {
        btn.innerHTML = t === 'dark' ? `${I('light')} Light Mode` : `${I('dark')} Dark Mode`;
      }
      const exportBtn = document.getElementById('exportAllBtn');
      if (exportBtn) exportBtn.innerHTML = `${I('download')} Export All Branches`;
      const formBtn = document.getElementById('formBtn');
      if (formBtn) formBtn.innerHTML = `${I('form')} Score Card Submission Form`;
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('raack_theme', next);
      applyTheme(next);
      loadDashboard();
    }
    applyTheme(localStorage.getItem('raack_theme') || 'light');

    function isDarkTheme() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

    function chartTextColor() { return isDarkTheme() ? '#f2f4f7' : '#16181d'; }

    function chartDimColor() { return isDarkTheme() ? '#7c8494' : '#8a93a1'; }

    function chartGridColor() { return isDarkTheme() ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)'; }

    Chart.register(ChartDataLabels);
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.font.size = 12.5;

    const CATEGORY_PIE_COLORS = ['#2563eb', '#0ea5e9', '#16a34a', '#d97706', '#db2777', '#7c3aed'];

    function tierColorForPercent(pct) {
      if (pct >= 85) return '#16a34a';
      if (pct >= 70) return '#0d9488';
      if (pct >= 50) return '#d97706';
      if (pct >= 30) return '#ea580c';
      return '#dc2626';
    }

    const RATING_BANDS = [
      { min: 800, max: 900, label: 'Excellent', color: '#16a34a', range: '800–900' },
      { min: 700, max: 799, label: 'Good', color: '#0d9488', range: '700–799' },

    function getLowSubMetrics(category, d, threshold = 70) {
      const subs = (SUB_METRICS[category] || []).filter(s => s.isPercent);
      const low = [];
      subs.forEach(s => {
        const val = d[s.key];
        if (val === undefined || val === null) return;
        const rounded = roundValue(val);
        if (rounded < threshold) low.push({ key: s.key, val: rounded, label: s.label });
      });
      low.sort((a, b) => a.val - b.val);
      return low;
    }

    // Financial year order (June–May) for the chart
    function financialYearMonths(year) {
      const monthNames = ['June', 'July', 'August', 'September', 'October', 'November', 'December',
        'January', 'February', 'March', 'April', 'May'
      ];
      const startMonth = 6; // June
      const result = [];
      for (let i = 0; i < 12; i++) {
        const m = (startMonth + i - 1) % 12 + 1;
        const y = (m >= 6) ? year : year + 1;
        const monthStr = String(m).padStart(2, '0');
        result.push([`${y}-${monthStr}`, `${monthNames[i]} ${y}`]);
      }
      return result;
    }

    async function renderDataView(branch, month, containerId) {
      const wrap = document.getElementById(containerId || 'dataViewWrap');
      if (!wrap) return;
      wrap.innerHTML = '<div class="loading" style="padding:20px;">Loading submitted data...</div>';
      try {
        const [rawRes, scoreRes] = await Promise.all([
          fetch(`/api/it/get?branch=${encodeURIComponent(branch)}&report_month=${encodeURIComponent(month)}`),
          fetch(`/api/dashboard/branch/${encodeURIComponent(branch)}?month=${encodeURIComponent(month)}`)
        ]);
        if (!rawRes.ok) {
          wrap.innerHTML = noDataHTML(`No data submitted for ${branch} — ${formatMonth(month)}.`, null, { compact: true });
          return;
        }
        const d = await rawRes.json();

        let summaryHTML = '';
        if (scoreRes.ok) {
          const scoreData = await scoreRes.json();
          if (scoreData && scoreData.rating !== 'No Data') {
            const roundedScoreData = {};
            for (const [key, value] of Object.entries(scoreData)) roundedScoreData[key] = typeof value ===
              'number' ? Math.round(value) : value;
            const finalScore = roundedScoreData.final_score || 0;
            const rating = roundedScoreData.rating || 'No Data';
            const baseScore = roundedScoreData.base_score || 0;
            const penalty = roundedScoreData.penalty || 0;
            const ratingClass = 'r-' + rating.replace(/\s/g, '');
            summaryHTML =
              `<div style="background:var(--surface-3);padding:12px 16px;border-radius:10px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;border:1px solid var(--line);">

                <span class="rating-badge ${ratingClass}">${rating}</span>
                <span style="color:var(--grey-500);font-size:12.5px;">Base: ${baseScore} | Penalty: -${penalty}</span>
              </div>`;
          }
        }

        let tableHTML = `<table class="data-view-table">`;
        tableHTML += `<tr><td class="k">Branch</td><td class="v">${dvFmtText(d.branch)}</td></tr>`;
        tableHTML +=
          `<tr><td class="k">Reporting Month</td><td class="v">${formatMonth(d.report_month || month)}</td></tr>`;

        const categoryOrder = ['Financial Health', 'Student Growth & Retention', 'Operations Discipline',
          'Brand & Quality Compliance', 'Customer Experience', 'Local Marketing & Community Growth',
          'Penalty & Comments'

              `<tr><td class="k" style="padding-left:24px;">${info.label}</td><td class="v">${dvFmtField(info.type, d[key])}</td></tr>`;
          });
        });
        tableHTML += `</table>`;

        wrap.innerHTML = `<div class="data-view-wrap">${summaryHTML}${tableHTML}</div>`;

    /* ===================== RENDER FUNCTIONS ===================== */
    function getMetricValue(item, metric) {
      const key = metric === 'rating_bands' ? 'final_score' : metric;
      return roundValue(item[key]);
    }

    function getBarColorForMetric(item, metric) {
      if (metric === 'final_score' || metric === 'rating_bands') return getRatingBand(item.final_score || 0).color;
      if (metric === 'penalty') {
        const p = item.penalty || 0;
        if (p === 0) return '#16a34a';
        if (p <= 15) return '#d97706';
        return '#dc2626';
      }
      const cfg = METRIC_OPTIONS.find(m => m.value === metric);
      const max = cfg ? cfg.max : 100;
      const pct = max ? (getMetricValue(item, metric) / max) * 100 : 0;
      return tierColorForPercent(pct);
    }

    function getChartValue(item, metric, submetric) {
      if (submetric && submetric !== 'overall') return roundValue(item[submetric]);
      return getMetricValue(item, metric);
    }

    function getChartColor(item, metric, submetric) {
      if (submetric && submetric !== 'overall') {
        const cfg = (SUB_METRICS[metric] || []).find(s => s.key === submetric);
        if (cfg && cfg.isPercent) return tierColorForPercent(roundValue(item[submetric]));
        return '#0ea5e9';
      }
      return getBarColorForMetric(item, metric);
    }

    function getChartMax(metric, submetric) {
      if (submetric && submetric !== 'overall') {
        const cfg = (SUB_METRICS[metric] || []).find(s => s.key === submetric);
        return cfg && cfg.isPercent ? null : undefined;
      }
      const metricCfg = METRIC_OPTIONS.find(m => m.value === metric) || METRIC_OPTIONS[0];
      return metricCfg.max;
    }

    function getChartLabel(metric, submetric) {
      if (submetric && submetric !== 'overall') {
        const cfg = (SUB_METRICS[metric] || []).find(s => s.key === submetric);
        return cfg ? cfg.label : metric;
      }
      const metricCfg = METRIC_OPTIONS.find(m => m.value === metric) || METRIC_OPTIONS[0];
      return metricCfg.label;
    }

    function findSubMetricCfg(metric, submetric) {
      return (SUB_METRICS[metric] || []).find(s => s.key === submetric) || null;
    }

    function getTierLabel(pct) {
      if (pct >= 85) return 'Excellent';
      if (pct >= 70) return 'Good';
      if (pct >= 50) return 'Watchlist';
      if (pct >= 30) return 'Risky';
      return 'Critical';
    }

    function getTierClass(pct) {
      if (pct >= 85) return 'excellent';
      if (pct >= 70) return 'good';
      if (pct >= 50) return 'watchlist';
      if (pct >= 30) return 'risky';

    /* ===================== FRANCHISE VIEW ===================== */

      const CAT_ROWS = [

      const totalPct = totalMax ? Math.round((totalActual / totalMax) * 1000) / 10 : 0;
      const totalColor = tierColorForPercent(totalPct);
      sdHTML += `
        <div class="sd-total">
          <div class="sd-label">Base Score</div>
          <div class="sd-bar-track">
            <div class="sd-bar-fill" style="width:${Math.min(totalPct, 100)}%;background:${totalColor};"></div>
            <div class="sd-bar-target"></div>
          </div>
          <div class="sd-value">${totalActual} <span class="max">/ ${totalMax}</span></div>
        </div>`;

      const penaltyVal = roundValue(roundedD.penalty);

        sdHTML += `
          <div class="sd-row">
            <div class="sd-label" style="color:#dc2626;">Penalty</div>
            <div class="sd-bar-track">
              <div class="sd-bar-fill" style="width:${Math.min((penaltyVal / totalMax) * 100, 100)}%;background:#dc2626;"></div>

            </div>
            <div class="sd-value" style="color:#dc2626;">-${penaltyVal}</div>
          </div>
          <div class="sd-total">
            <div class="sd-label">Final Score</div>
            <div class="sd-bar-track">
              <div class="sd-bar-fill" style="width:${Math.min((roundedD.final_score / totalMax) * 100, 100)}%;background:${tierColorForPercent(Math.round((roundedD.final_score / totalMax) * 1000) / 10)};"></div>

            </div>
            <div class="sd-value">${roundedD.final_score} <span class="max">/ ${totalMax}</span></div>

      sdHTML += `<div style="margin-top:6px;font-size:12px;color:var(--grey-500);">Target shown as 100% of max score</div>`;

      // ----- Focus Areas content (now rendered inside the collapsible box at the top of the card) -----
      let focusChipsHTML = '';

      }

        <div class="rating-legend-inline">
          <span style="font-weight:700;color:var(--grey-300);margin-right:2px;">Rating:</span>
          ${RATING_BANDS.map(b => `
            <span class="rating-legend-chip" style="background:${b.color}1a;color:${b.color};border-color:${b.color}55;">
              <span class="rl-dot" style="background:${b.color};"></span><span class="rlc-range">${b.range}</span>${b.label}
            </span>`).join('')}
        </div>
      `;

      const remaining = Math.max(0, 900 - roundedD.final_score);
      const band = getRatingBand(roundedD.final_score);

      const scoreHighlightHTML = `
        <div class="card grid-full" id="scoreHighlightCard">
          <h2>${I('target')} Final Score</h2>
          <div class="score-highlight-wrap">
            <div class="score-highlight-chart">
              <canvas id="scoreHighlightChart"></canvas>
              <div class="score-highlight-center">
                <div class="shc-value" style="color:${band.color};">${roundedD.final_score}</div>
                <div class="shc-max">/ 900</div>
              </div>
            </div>
            <div class="score-highlight-info">
              <span class="rating-badge r-${roundedD.rating.replace(/\s/g, '')}">${roundedD.rating}</span>
              <div class="shc-message" style="color:${band.color};">
                ${remaining > 0 ? `${remaining} points away from your target. Keep going!` : 'Target achieved! 🎉'}
              </div>
              <div class="shc-sub">${userBranch} — ${formatMonth(currentMonth)}</div>
            </div>
          </div>
        </div>
      `;

      content.innerHTML = `
        ${scoreHighlightHTML}

        <div class="card grid-full">
          <h2>
            ${I('dashboard')} Category Score Overview
            <span class="spacer"></span>
            <span class="card-header-actions">
              <button class="icon-btn dataview" onclick="openDataViewModal('${userBranch}','${currentMonth}')">${I('folder')} Data View</button>
              <button class="icon-btn export" onclick="exportBranchHistory('${userBranch}')">${I('download')} All Months (Excel)</button>
            </span>
          </h2>
          ${catOverviewHTML}
        </div>

        <div class="card grid-full" id="scoreDistributionCard">
          <h2>${I('chart')} Score Distribution <span class="badge">${formatMonth(currentMonth)}</span>
            <span class="spacer"></span>
            <button class="icon-btn focus-toggle" id="focusAreaToggleBtn" onclick="toggleFocusBox()">${I('flag')} Focus Areas ${I('chevron')}</button>
            ${ratingLegendHTML}
          </h2>
          <div class="focus-area-box" id="focusAreaBox" style="display:none;">
            <div style="font-weight:700;font-size:12.5px;color:var(--grey-500);margin-bottom:8px;">Focus Areas — categories below 70%</div>
            ${focusChipsHTML}
          </div>
          ${sdHTML}
        </div>

        <!-- Month-wise Score Chart (Financial Year order: June → May) -->
        <div class="card grid-full" id="monthWiseScoreCard">
          <h2>${I('calendar')} Month-wise Score <span class="badge">${userBranch} — FY ${currentYear}–${parseInt(currentYear) + 1}</span></h2>
          <div class="chart-box" style="height:320px;"><canvas id="monthWiseChart"></canvas></div>
          <p class="chart-hint">${I('chart')} The trend line traces ${userBranch}'s score across each month of the financial year (June → May). Use the year dropdown above to switch to another financial year.</p>
        </div>
      `;

      renderScoreHighlightChart(roundedD.final_score, band);
      renderMonthWiseChart(userBranch);
    }

    /* ===================== Month-wise Score trend chart (franchise) - Financial year order ===================== */
    async function renderMonthWiseChart(branch) {
      const canvas = document.getElementById('monthWiseChart');
      if (!canvas) return;

      // Use financial year months (June to May)
      const fyMonths = financialYearMonths(parseInt(currentYear));
      const results = await Promise.all(fyMonths.map(async ([mv, ml]) => {
        try {
          const res = await fetch(
            `/api/dashboard/branch/${encodeURIComponent(branch)}?month=${mv}`);
          if (!res.ok) return { month: mv, label: ml, score: null };
          const d = await res.json();
          if (!d || d.rating === 'No Data') return { month: mv, label: ml, score: null };
          return { month: mv, label: ml, score: roundValue(d.final_score) };
        } catch (err) { return { month: mv, label: ml, score: null }; }
      }));

      const labels = results.map(r => r.label.split(' ')[0].slice(0, 3)); // e.g., Jun, Jul, ...
      const scores = results.map(r => r.score);
      const t = chartTextColor(),
        d2 = chartDimColor(),
        g2 = chartGridColor();

      if (charts.monthWise) {
        charts.monthWise.destroy();
        charts.monthWise = null;
      }

      const ctx2d = canvas.getContext('2d');
      const gradient = ctx2d.createLinearGradient(0, 0, 0, 320);
      gradient.addColorStop(0, isDarkTheme() ? 'rgba(220,38,38,0.35)' : 'rgba(220,38,38,0.20)');
      gradient.addColorStop(1, isDarkTheme() ? 'rgba(220,38,38,0.02)' : 'rgba(220,38,38,0.0)');

      charts.monthWise = new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Score',
            data: scores,
            borderColor: '#dc2626',
            backgroundColor: gradient,
            borderWidth: 2.5,
            tension: 0.35,
            cubicInterpolationMode: 'monotone',
            spanGaps: true,
            fill: 'origin',
            pointRadius: (ctx) => (ctx.raw === null ? 0 : 3.5),
            pointHoverRadius: 6,
            pointBackgroundColor: '#dc2626',
            pointBorderColor: isDarkTheme() ? '#dc2626' : '#ffffff',
            pointBorderWidth: 2,
            pointHitRadius: 10,
            datalabels: {
              display: (ctx) => ctx.dataset.data[ctx.dataIndex] !== null,
              color: '#dc2626',
              anchor: 'end',
              align: 'top',
              offset: 6,
              font: { size: 11, weight: 'bold' },
              formatter: (val) => (val === null ? '' : val)
            }
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 26 } },
          plugins: { legend: { display: false }, title: { display: false } },
          scales: {
            x: { ticks: { color: t, font: { size: 11, weight: '600' } }, grid: { display: false } },
            y: { min: 0, max: 900, ticks: { color: d2, font: { size: 11 } }, grid: { color: g2 } }
          }
        }
      });
    }

    /* ===================== TEAM VIEW (IT/Accounts/Superuser) ===================== */
    async function renderTeamView(content) {
      const res = await fetch(`/api/dashboard/all?month=${currentMonth}`);
      if (!res.ok) throw new Error('Failed to fetch data');
      const data = await res.json();

      const roundedData = data.map(item => {
        const rounded = {};
        for (const [key, value] of Object.entries(item)) rounded[key] = typeof value === 'number' ? Math
          .round(value) : value;
        return rounded;
      });

      lastAllBranchesData = roundedData;

      if (roundedData.length === 0) {
        content.innerHTML = noDataHTML(`No data available for ${formatMonth(currentMonth)}`,
          'Please submit IT form data first');
        return;
      }

      const submittedOnly = roundedData.filter(item => (item.rating || 'No Data') !== 'No Data');
      const sorted = [...submittedOnly].sort((a, b) => (b.final_score || 0) - (a.final_score || 0));

      // Only show Top 5 / Bottom 5 for SUPERUSER
      let html = '';

      // Helper to build one ranking row (used by Top 5 / Bottom 5) - name + score only, no bar
      function rankRowHTML(item, idx) {
        const band = getRatingBand(item.final_score || 0);
        const pct = Math.round(((item.final_score || 0) / 900) * 100);
        return `
          <div class="ranking-row" data-branch="${item.branch}" style="grid-template-columns:30px 1fr 76px 58px;">
            <div class="ranking-rank">${idx + 1}</div>
            <div class="ranking-name" style="margin-bottom:0;">${I('building')} ${item.branch}</div>
            <div class="ranking-score">${item.final_score || 0} <span class="max">/900</span></div>
            <div><span class="ranking-pct-badge" style="background:${band.color}22;color:${band.color};">${pct}%</span></div>
          </div>`;
      }

      if (userRole === 'superuser') {
        const top5 = sorted.slice(0, 5);
        const bottom5 = [...sorted].slice(-5).reverse();

        html += `
        <div class="card">
          <h2>${I('trophy')} Top 5 Branches <span class="badge">${formatMonth(currentMonth)}</span></h2>
          <div class="ranking-list">
            ${top5.length ? top5.map((item, idx) => rankRowHTML(item, idx)).join('') : noDataHTML('No branches have submitted data for this month yet.', null, { compact: true })}
          </div>
        </div>
        <div class="card">
          <h2>${I('warning')} Bottom 5 Branches <span class="badge">${formatMonth(currentMonth)}</span></h2>
          <div class="ranking-list">
            ${bottom5.length ? bottom5.map((item, idx) => rankRowHTML(item, idx)).join('') : noDataHTML('No branches have submitted data for this month yet.', null, { compact: true })}
          </div>
        </div>`;
      }

      // BRANCH-WISE SCORE as RED LINE CHART - visible to all (IT, Accounts, Superuser)
      html += `
        <!-- BRANCH-WISE SCORE as RED LINE CHART (TrendViewer style) -->
        <div class="card grid-full" id="overallMonthWiseCard">
          <h2>${I('building')} Branch-wise Score <span class="badge">All Branches — ${formatMonth(currentMonth)}</span></h2>
          <div class="chart-box branch-line" style="position:relative;height:380px;max-height:380px;">
            <canvas id="overallMonthWiseChart"></canvas>
          </div>
          <p class="chart-hint">${I('chart')} <strong style="color:#dc2626;">●</strong> Final score for every branch in ${formatMonth(currentMonth)} — sorted high to low. <strong>Click a data point to open that branch's dashboard</strong>.</p>
        </div>`;

      if (sorted.length > 0 && userRole === 'superuser') {
        html += `
          <div class="card grid-full">
            <h2>${I('dashboard')} All Branches — ${formatMonth(currentMonth)} <span class="badge">Click a row for full scoring</span></h2>
            <div class="filters">
              <div class="filter-label">${I('search')} <input type="text" id="searchInput" placeholder="Search branch..." style="flex:1;min-width:150px;"></div>
              <div class="filter-label">Rating:
                <select id="ratingFilter">
                  <option value="all">All Ratings</option>
                  <option value="Excellent">Excellent</option>
                  <option value="Good">Good</option>
                  <option value="Watchlist">Watchlist</option>
                  <option value="Risky">Risky</option>
                  <option value="Critical">Critical</option>
                </select>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Branch</th>
                    <th>Score</th>
                    <th>Rating</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="branchTableBody">`;
        sorted.forEach((item, i) => {
          const ratingClass = 'r-' + (item.rating || 'NoData').replace(/\s/g, '');
          const svClass = 'sv-' + (item.rating || 'NoData').replace(/\s/g, '');
          html += `<tr data-branch="${item.branch}" data-rating="${item.rating || 'No Data'}">
                      <td>${i + 1}</td>
                      <td class="branch-name">${I('building')} ${item.branch}</td>
                      <td class="score-value ${svClass}">${item.final_score || 0} <span class="score-max">/900</span></td>
                      <td><span class="rating-badge ${ratingClass}">${item.rating || 'No Data'}</span></td>
                      <td>${item.action || '—'}</td>
                    </tr>`;
        });
        html += `</tbody></table></div></div>`;
      }

      content.innerHTML = html;

      // Wire up click-to-navigate for the Top 5 / Bottom 5 rows (SUPERUSER only)
      if (userRole === 'superuser') {
        document.querySelectorAll('.ranking-row').forEach(row =>
          row.addEventListener('click', () => navigateToBranch(row.dataset.branch))
        );
      }

      // Render the branch-wise score chart (visible to all)
      renderBranchWiseScoreChart();

      // Table search/filter (SUPERUSER only)
      if (sorted.length > 0 && userRole === 'superuser') {
        document.querySelectorAll('#branchTableBody tr').forEach((row) => row.addEventListener('click', () =>
          navigateToBranch(row.dataset.branch)));

        const searchInput = document.getElementById('searchInput');
        const ratingFilter = document.getElementById('ratingFilter');

        function filterRows() {
          const search = searchInput.value.toLowerCase();
          const rating = ratingFilter.value;
          document.querySelectorAll('#branchTableBody tr').forEach(row => {
            const name = row.dataset.branch.toLowerCase();
            const rowRating = row.dataset.rating;
            let show = true;
            if (search && !name.includes(search)) show = false;
            if (rating !== 'all' && rowRating !== rating) show = false;
            row.style.display = show ? '' : 'none';
          });
        }
        searchInput.addEventListener('input', filterRows);
        ratingFilter.addEventListener('change', filterRows);
      }
    }

    /* ===================== BRANCH-WISE SCORE as RED LINE CHART ===================== */
    function renderBranchWiseScoreChart() {
      const canvas = document.getElementById('overallMonthWiseChart');
      const box = document.getElementById('overallMonthWiseCard');
      if (!canvas) return;

      // Sort branches by final score descending (high to low) for the line chart
      const sortedBranches = [...lastAllBranchesData].sort((a, b) => (b.final_score || 0) - (a.final_score || 0));

      const labels = sortedBranches.map(r => r.branch);
      const hasData = sortedBranches.map(r => (r.rating || 'No Data') !== 'No Data');
      const scores = sortedBranches.map((r, i) => hasData[i] ? roundValue(r.final_score) : null);

      // Red color palette
      const lineRed = '#dc2626';
      const fillRed = isDarkTheme() ? 'rgba(220,38,38,0.18)' : 'rgba(220,38,38,0.12)';
      const pointBg = '#dc2626';
      const pointBorder = isDarkTheme() ? '#1b1f28' : '#ffffff';

      if (charts.overallMonthWise) {
        charts.overallMonthWise.destroy();
        charts.overallMonthWise = null;
      }

      const t = chartTextColor(),
        d2 = chartDimColor(),
        g2 = chartGridColor();

      // Build a gradient fill for the area under the line
      const ctx2d = canvas.getContext('2d');
      const gradient = ctx2d.createLinearGradient(0, 0, 0, 380);
      gradient.addColorStop(0, isDarkTheme() ? 'rgba(220,38,38,0.35)' : 'rgba(220,38,38,0.25)');
      gradient.addColorStop(0.6, isDarkTheme() ? 'rgba(220,38,38,0.08)' : 'rgba(220,38,38,0.05)');
      gradient.addColorStop(1, isDarkTheme() ? 'rgba(220,38,38,0.0)' : 'rgba(220,38,38,0.0)');

      charts.overallMonthWise = new Chart(canvas, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Final Score',
            data: scores,
            borderColor: lineRed,
            backgroundColor: gradient,
            borderWidth: 2.8,
            tension: 0.25,
            cubicInterpolationMode: 'monotone',
            spanGaps: true,
            fill: 'origin',
            pointRadius: (ctx) => {
              const val = ctx.dataset.data[ctx.dataIndex];
              return (val !== null && val !== undefined) ? 4.5 : 0;
            },
            pointHoverRadius: 8,
            pointBackgroundColor: pointBg,
            pointBorderColor: pointBorder,
            pointBorderWidth: 2,
            pointHitRadius: 14,
            datalabels: {
              display: (ctx) => {
                const val = ctx.dataset.data[ctx.dataIndex];
                return val !== null && val !== undefined;
              },
              color: lineRed,
              anchor: 'end',
              align: 'top',
              offset: 5,
              font: { size: 10, weight: '700' },
              formatter: (val) => (val === null || val === undefined) ? '' : val
            }
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: {
              top: 30,
              right: 20,
              left: 10,
              bottom: 30
            }
          },
          plugins: {
            legend: { display: false },
            title: { display: false },
            tooltip: {
              callbacks: {
                title: (items) => {
                  if (!items.length) return '';
                  const idx = items[0].dataIndex;
                  return sortedBranches[idx] ? sortedBranches[idx].branch : '';
                },
                label: (item) => {
                  const val = item.raw;
                  if (val === null || val === undefined) return 'No data';
                  return `Score: ${val} / 900`;
                }
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: d2,
                font: { size: 10, weight: '600' },
                maxRotation: 50,
                minRotation: 40,
                autoSkip: false,
                callback: function (value) {
                  const label = this.getLabelForValue(value);
                  return label.length > 14 ? label.slice(0, 14) + '…' : label;
                }
              },
              grid: { display: false }
            },
            y: {
              min: 0,
              max: 900,
              ticks: {
                color: d2,
                font: { size: 10 },
                stepSize: 100
              },
              grid: {
                color: g2,
                drawTicks: true
              }
            }
          },
          onClick: (e, elements) => {
            if (elements && elements.length > 0) {
              const idx = elements[0].index;
              const branch = sortedBranches[idx];
              if (branch && hasData[idx]) navigateToBranch(branch.branch);
            }
          }
        }
      });
    }

    /* ===================== LOAD DASHBOARD ===================== */
    async function loadDashboard() {
      destroyCharts();
      const content = document.getElementById('dashboardContent');
      content.innerHTML = '<div class="loading">Loading dashboard data...</div>';
      try {
        if (userRole === 'franchise' && userBranch) {
          await renderFranchiseView(content);
        } else if (userRole === 'it' || userRole === 'accounts' || userRole === 'superuser') {
          await renderTeamView(content);
        } else {
          content.innerHTML = noDataHTML(`Invalid role: ${userRole}`, 'Please check your login credentials.');
        }
      } catch (error) {
        content.innerHTML =
          `<div class="empty-state">${I('errorx')}<p>Error loading data: ${error.message}</p></div>`;
      }
      updateBackButton();
    }

    /* ===================== BACK BUTTON ===================== */
    function updateBackButton() {
      const backBtn = document.getElementById('backBtn');
      if (!backBtn) return;

      if (fromRole && fromRole !== 'franchise' && userRole === 'franchise') {
        backBtn.href = `/dashboard?role=${fromRole}`;
        backBtn.innerHTML = `${I('arrowleft')} Back to Dashboard`;
      } else {
        backBtn.href = '/login';
        backBtn.innerHTML = `${I('arrowleft')} Logout`;
      }
    }

    updateBackButton();
    loadDashboard();
  </script>

</body>

</html>
